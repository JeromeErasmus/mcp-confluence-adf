    title: "What You'll Learn"
    content_instruction: "List the main topics covered in this guide and learning outcomes"
  - section: "System Requirements"
    description: "Hardware and software prerequisites needed to run the application"
    content_instruction: "Detail minimum system requirements, supported operating systems, and any dependencies"
  - section: "Installation"
    description: "Step-by-step installation instructions for different platforms"
    content_instruction: "Provide clear installation steps with screenshots or command examples for each supported platform"
  - type: "code_block"
    language: "bash"
    purpose: "installation"
    content_instruction: "Show command-line installation commands (if applicable)"
  - type: "warning_panel"
    title: "Installation Notes"
    content_instruction: "Important warnings, common installation issues, or platform-specific considerations"
  - section: "Initial Setup and Configuration"
    description: "First-time setup, configuration options, and account creation"
    content_instruction: "Guide users through initial configuration, creating profiles, and essential settings"
  - type: "expandable"
    title: "Advanced Configuration Options"
    content_instruction: "Detail advanced settings and customization options for power users"
  - section: "Getting Started"
