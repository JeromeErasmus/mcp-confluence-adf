  - section: "Tips and Best Practices"
    description: "Helpful tips, shortcuts, and best practices for efficient usage"
    content_instruction: "Share expert tips, keyboard shortcuts, workflow optimizations, and common best practices"
  - type: "info_panel"
    title: "Pro Tips"
    content_instruction: "Highlight advanced tips and power-user features"
  - section: "Troubleshooting"
    description: "Common problems and solutions, FAQ, and diagnostic steps"
    content_instruction: "Address frequently encountered issues with step-by-step resolution guides"
  - type: "expandable"
    title: "Advanced Troubleshooting"
    content_instruction: "Detailed troubleshooting for complex issues, log analysis, and diagnostic procedures"
  - section: "Getting Help"
    description: "Support resources, community forums, and additional documentation"
    content_instruction: "Provide information about support channels, documentation, tutorials, and community resources"
  - section: "Frequently Asked Questions"
    description: "Common questions and answers from user community"
