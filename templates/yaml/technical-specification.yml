---
name: "Technical Specification"
description: "Comprehensive technical specification template for software projects and systems"
version: "1.0.0"
category: "technical"
output_type: "structured_template"
sections: ["overview", "architecture", "requirements", "design", "implementation", "testing"]
user_context_required:
  project_name: "What is the name of your project or system?"
  system_type: "What type of system is this (e.g., web application, API, mobile app, service)?"
  stakeholders: "Who are the key stakeholders for this specification?"
---

structure:
  - "# {{project_name}} Technical Specification"
  - "## Document Information"
  - type: "info_panel"
    title: "Document Status"
    content_instruction: "Include document version, last updated date, author information, and approval status"
  - section: "Executive Summary"
    description: "High-level overview of the project scope, objectives, and key technical decisions"
    content_instruction: "Provide a concise summary of what this specification covers, main goals, and critical technical approaches"
  - section: "System Overview"
    description: "Comprehensive description of the system's purpose, scope, and context within the broader architecture"
    content_instruction: "Explain the system's role, primary functions, and how it fits into the overall technical ecosystem"
  - type: "expandable"
    title: "System Context Diagram"
    content_instruction: "Include or describe system context diagram showing external interfaces and data flows"
  - section: "Functional Requirements"
    description: "Detailed specification of system functionality, user stories, and business logic requirements"
    content_instruction: "Document what the system must do, including user requirements, business rules, and functional capabilities"
  - section: "Non-Functional Requirements"
    description: "Performance, security, scalability, and quality attributes the system must meet"
    content_instruction: "Specify performance targets, security requirements, scalability needs, reliability goals, and usability standards"
  - type: "warning_panel"
    title: "Critical Requirements"
    content_instruction: "Highlight the most critical non-functional requirements that cannot be compromised"
  - section: "System Architecture"
    description: "High-level architectural design, components, and system structure"
    content_instruction: "Describe the overall architecture, major components, their relationships, and architectural patterns used"
  - type: "expandable"
    title: "Architecture Diagrams"
    content_instruction: "Include or reference system architecture diagrams, component diagrams, and deployment views"
  - section: "Technology Stack"
    description: "Programming languages, frameworks, databases, and tools used in the system"
    content_instruction: "List and justify technology choices including languages, frameworks, databases, cloud services, and development tools"
  - section: "Data Design"
    description: "Database schema, data models, and data flow specifications"
    content_instruction: "Document data structures, database design, data relationships, and data processing workflows"
  - type: "code_block"
    language: "sql"
    purpose: "schema_example"
    content_instruction: "Show key database schema elements or data model examples"
  - section: "API Specifications"
    description: "External and internal API definitions, endpoints, and integration points"
    content_instruction: "Document API contracts, endpoint specifications, authentication methods, and integration requirements"
  - type: "code_block"
    language: "json"
    purpose: "api_example"
    content_instruction: "Provide example API request/response payloads"
  - section: "Security Considerations"
    description: "Security architecture, authentication, authorization, and data protection measures"
    content_instruction: "Detail security design, threat model, authentication mechanisms, encryption, and compliance requirements"
  - type: "warning_panel"
    title: "Security Requirements"
    content_instruction: "Emphasize critical security requirements and potential vulnerabilities to address"
  - section: "Performance and Scalability"
    description: "Performance targets, scalability design, and resource utilization specifications"
    content_instruction: "Define performance benchmarks, scalability approach, load handling capacity, and resource optimization strategies"
  - section: "Implementation Plan"
    description: "Development approach, milestones, and implementation phases"
    content_instruction: "Outline implementation strategy, development phases, key milestones, and delivery timeline"
  - section: "Testing Strategy"
    description: "Testing approach, test types, and quality assurance procedures"
    content_instruction: "Define testing methodology, unit/integration/system test approaches, and quality gates"
  - section: "Deployment and Operations"
    description: "Deployment strategy, operational requirements, and maintenance procedures"
    content_instruction: "Specify deployment approach, operational monitoring, maintenance procedures, and support requirements"
  - type: "success_panel"
    title: "Acceptance Criteria"
    content_instruction: "Define clear acceptance criteria and definition of done for the project"
  - section: "Dependencies and Assumptions"
    description: "External dependencies, assumptions made, and potential risks"
    content_instruction: "List critical dependencies, key assumptions, and identified risks with mitigation strategies"
  - section: "Appendices"
    description: "Additional technical details, references, and supporting documentation"
    content_instruction: "Include detailed technical appendices, references to external documents, and glossary of terms"