---
name: "Quick Start Guide"
description: "Streamlined quick start guide template with modular sections"
version: "1.0.0"
category: "user-guide"
output_type: "structured_template"
sections: ["overview", "installation", "first_steps", "examples"]
user_context_required:
  tool_name: "What is the name of your tool or application?"
  primary_use_case: "What is the main thing users will do with this tool?"
---

structure:
  - "# {{tool_name}} Quick Start Guide"
  - "## Get Started in 5 Minutes"
  - type: "success_panel"
    title: "Quick Start Goal"
    content_instruction: "Clearly state what users will accomplish by following this guide (e.g., 'Deploy your first application', 'Make your first API call')"
  - section: "What You Need"
    description: "Prerequisites and requirements check before getting started"
    content_instruction: "List minimal requirements, account setup needs, and any tools users should have installed beforehand"
  - module_ref: "@templates/yaml/common-sections.yml#installation_section"
    content_context: "Focus on the quickest installation method for immediate productivity"
  - section: "Your First {{primary_use_case}}"
    description: "Step-by-step tutorial for the most common initial task"
    content_instruction: "Provide a concrete example that demonstrates the core functionality and gets users to a working result quickly"
  - type: "code_block"
    language: "bash"
    purpose: "first_example"
    content_instruction: "Show the essential commands or code needed for the first successful use"
  - type: "info_panel"
    title: "What Just Happened?"
    content_instruction: "Explain what the user just accomplished and briefly describe the underlying process"
  - section: "Next Steps"
    description: "Logical next actions and learning progression for users"
    content_instruction: "Suggest 2-3 logical next steps, more advanced tutorials, or deeper documentation sections to explore"
  - type: "expandable"
    title: "Common Variations"
    content_instruction: "Show variations of the basic example for different common use cases"
  - module_ref: "@templates/yaml/common-sections.yml#troubleshooting_section"
    content_context: "Focus on issues specific to initial setup and first-time usage"
  - module_ref: "@templates/yaml/common-sections.yml#support_section"
    content_context: "Emphasize beginner-friendly support resources and community channels"