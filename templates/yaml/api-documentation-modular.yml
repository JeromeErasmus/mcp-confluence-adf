---
name: "API Documentation Modular"
description: "Comprehensive API documentation with modular sections and ADF formatting"
version: "1.0.0"
category: "api"
output_type: "structured_template"
sections: ["getting_started", "authentication", "endpoints", "examples", "troubleshooting"]
user_context_required:
  api_name: "What is your API called?"
  base_url: "What is your API base URL?"
  auth_type: "What authentication method does your API use?"
---

structure:
  - "# {{api_name}} API Documentation"
  - "## Overview"
  - section: "Getting Started"
    description: "Introduction and setup instructions for developers using the API"
    content_instruction: "Provide clear steps for getting started with the API, including registration, setup, and first API call"
  - type: "info_panel"
    title: "Prerequisites"
    content_instruction: "List technical requirements, dependencies, or account setup needed"
  - section: "Authentication" 
    description: "Security requirements and authentication methods for API access"
    content_instruction: "Explain the authentication flow, required headers, token management, and security best practices"
  - type: "warning_panel"
    title: "Security Notice"
    content_instruction: "Important security warnings about API key handling and HTTPS requirements"
  - section: "Base URL and Environment"
    description: "API endpoints and environment configuration details"
    content_instruction: "Document the base URL, available environments (dev, staging, production), and any environment-specific considerations"
  - type: "code_block"
    language: "bash"
    purpose: "base_url_example"
    content_instruction: "Show example API base URL and basic curl command structure"
  - section: "API Endpoints"
    description: "Complete reference of all available API endpoints with request/response examples"
    content_instruction: "Document each endpoint with HTTP method, path, parameters, request body, and response format"
  - type: "expandable"
    title: "Endpoint Reference Table"
    content_instruction: "Create a comprehensive table of all endpoints with methods, paths, and descriptions"
  - section: "Request and Response Examples"
    description: "Practical examples showing API usage patterns and common scenarios"
    content_instruction: "Provide working code examples in multiple programming languages (curl, JavaScript, Python)"
  - type: "code_block"
    language: "javascript"
    purpose: "sdk_example"
    content_instruction: "Show JavaScript/Node.js SDK usage example"
  - type: "code_block"
    language: "python"
    purpose: "python_example"
    content_instruction: "Show Python requests library example"
  - section: "Error Handling"
    description: "Error codes, messages, and troubleshooting guide for common issues"
    content_instruction: "Document error response format, HTTP status codes, and resolution steps for common errors"
  - type: "expandable"
    title: "Error Code Reference"
    content_instruction: "Create a detailed table of error codes, descriptions, and solutions"
  - section: "Rate Limiting"
    description: "API usage limits, rate limiting policies, and best practices for high-volume usage"
    content_instruction: "Explain rate limits, headers returned, and strategies for handling rate limit responses"
  - section: "SDKs and Libraries"
    description: "Available client libraries, SDKs, and community tools for API integration"
    content_instruction: "List official and community SDKs with installation and basic usage instructions"
  - section: "Changelog and Versioning"
    description: "API version history, breaking changes, and migration guides"
    content_instruction: "Document API versioning strategy, recent changes, and migration paths between versions"
  - type: "success_panel"
    title: "Support"
    content_instruction: "Provide contact information, support channels, and links to additional resources"